[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ms-ai-ml-helper-core"
version = "0.1.1"
description = "Shared Python helper core for Masterschool AI/ML app development notebooks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Masterschool" }]
dependencies = [
  "chromadb>=0.5,<2",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "mcp[cli]>=2,<3",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
]

[project.urls]
Homepage = "https://github.com/richhiey/ai-app-dev_Mod-A"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = [
  "agent",
  "documents",
  "hybrid",
  "hyde",
  "keyword_search",
  "mcp_client",
  "mcp_server",
  "models",
  "openrouter",
  "rerank",
  "structured_graph",
  "tools",
  "vector_store",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
